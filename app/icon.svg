<svg xmlns="http://www.w3.org/2000/svg" viewBox="-107.38 -91.77 205.38 205.38">
<!--
  One flat colour: the light-theme highlight teal, the same #12A594 that
  LogoMark lights its nearest nodes with on light. No depth ramp and no
  prefers-color-scheme variant, so the mark reads as a single silhouette
  wherever a browser puts it.
-->
<style>.n{fill:#12A594}.l{stroke:#12A594;stroke-linecap:round}</style>
<circle class="n" cx="-57.82" cy="54.49" r="15.26"/>
<line class="l" x1="0.00" y1="0.00" x2="-57.82" y2="54.49" stroke-width="15.08"/>
<circle class="n" cx="74.13" cy="11.57" r="16.26"/>
<line class="l" x1="0.00" y1="0.00" x2="74.13" y2="11.57" stroke-width="15.54"/>
<circle class="n" cx="0.00" cy="0.00" r="33.92"/>
<line class="l" x1="0.00" y1="0.00" x2="-1.45" y2="75.31" stroke-width="16.09"/>
<circle class="n" cx="-1.45" cy="75.31" r="17.45"/>
<line class="l" x1="0.00" y1="0.00" x2="-81.49" y2="-20.71" stroke-width="16.48"/>
<circle class="n" cx="-81.49" cy="-20.71" r="18.28"/>
<line class="l" x1="0.00" y1="0.00" x2="60.39" y2="-51.42" stroke-width="17.05"/>
<circle class="n" cx="60.39" cy="-51.42" r="19.51"/>
</svg>
